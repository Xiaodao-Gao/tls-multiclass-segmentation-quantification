name: CPU software checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install package and tests
        run: python -m pip install -e '.[dev]'
      - name: Check dependencies
        run: python -m pip check
      - name: Run software checks
        run: python -m pytest -q --junitxml=outputs/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: software-test-report
          path: outputs/junit.xml
