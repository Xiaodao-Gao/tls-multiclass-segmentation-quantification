[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tls-single-step-segmentation"
version = "0.1.1"
description = "Encoder multi-scale fusion and single-step feature refinement for four-class TLS segmentation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch==2.5.1",
  "torchvision==0.20.1",
  "segmentation-models-pytorch==0.5.0",
  "einops==0.8.1",
  "numpy==2.2.6",
  "Pillow==11.3.0",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
tlsseg = "tlsseg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
